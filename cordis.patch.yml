# 把服务端入口插进 Harness 的插件树（workbench-standard §3.3）。
#
# 两条硬规则：
# 1. name 必须写 npm 包名，写相对路径或绝对路径 Node 解析不到；
# 2. 空文件或纯注释文件会导致启动失败——有条目就照下面写，没有条目时写 `[]`。
#
# id / root 的取值在 lib/identity.js，与 dsh/host.js 的 name、dsh/index.js 的
# PLUGIN_ID 三处必须同值，别手改这里。

- insert:
    - id: lymphoma-workbench-main
      name: "@lymbell-dsh/lymphoma-workbench"
      config:
        root: !!js dshHomePath('lymphoma-workbench')
